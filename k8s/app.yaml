apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-application
  labels:
    app: cloud-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-application
  template:
    metadata:
      labels:
        app: cloud-application
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: cloud-application
        image: container-registry.br-se1.magalu.cloud/${MGC_REGISTRY_NAME}/cloud-application:${IMAGE_TAG}
        ports:
        - containerPort: 8000
        # Base de cálculo do HPA: o alvo de utilização é percentual sobre o
        # requests.cpu. Sem isso o HPA fica com TARGETS <unknown> e não escala.
        #
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        # timeoutSeconds e failureThreshold explícitos: sob carga o /health
        # pode passar do default de 1s e o kubelet mata um pod que só está lento.
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: cloud-application
  labels:
    app: cloud-application
spec:
  selector:
    app: cloud-application
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP